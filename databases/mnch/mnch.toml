q7KhhAnm5GA = { constant = true, if = "event.number = 4", fill = 0.95 } # rubella 1
Bxh1xgIY9nA = { constant = true, if = "event.number = 5", fill = 0.95 } # measles 2

[program.IMM_EIR.attributes]
GIVEN_NAME = { words = { n = 20_000, s = 1.4, q = 25, vocabulary = "given" } }
FAMILY_NAME = { words = { n = 100_000, s = 1.05, q = 20, vocabulary = "family" } }
PATINFO_DOB = { sql = "record.date - tracked_entity.age_at_first" }
PATINFO_SEX = { weights = { FEMALE = 1, MALE = 1 } }
UNIQUE_SYS_ID_EPI = { pattern = '"EPI_" + RANDOM(########)' }
VPD_CS_PATINFO_RESADMIN0 = { sql = "district.name || ', ' || region.name" } # home address
"Primary contact's first name" = { words = { n = 20_000, s = 1.4, q = 25, vocabulary = "given" } }
"Primary contact's last name" = { words = { n = 100_000, s = 1.05, q = 20, vocabulary = "family" } }
"Primary contact number" = { phone = true, fill = 0.7 }

[records]
deleted = 0.01
followup = 0.03
updated = { share = 0.1, after = { exponential = 30 } }

[load]
order = "created" # rows in the order a live instance inserts them
