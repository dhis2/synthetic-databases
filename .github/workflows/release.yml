# A release, on a tag: build the release area at 42.0, upgrade it to each version, check every
# version and publish them all, or none. Then run core's perf tests on each from the bucket.
#
# Dispatched from a branch, it is a dry run: the same build, upgrades and checks, then publish
# --dry-run, which shows what it would upload and why it would refuse. No upload, no perf tests.
#
# Needs, of the organization and this repository:
# * variable PUBLISH set to true, once the secrets below are set: without it a tag runs the dry
#   run, with a warning, and dispatches no perf tests
# * secrets PERF_DATABASES_AWS_ACCESS_KEY_ID and PERF_DATABASES_AWS_SECRET_ACCESS_KEY, allowed
#   s3:PutObject under s3://databases.dhis2.org/perfland-mnch/
# * for the perf tests: variable CORE_PERF_TESTS set to true, secret CORE_PERF_TESTS_TOKEN allowed
#   to run workflows of dhis2/dhis2-core, and optionally variable CORE_PERF_TESTS_REF, the ref of
#   core's perf tests (default: master)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One upload to the bucket at a time, dev.yml's among them.
concurrency:
  group: publish-perfland-mnch
  cancel-in-progress: false

jobs:
  release:
    # A standard runner of a public repository: 4 CPUs and 16 GB, with the caps of ci.yml's
    # release-test. Its disk holds the release with room to spare; disk.log shows the peak.
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      versions: ${{ steps.images.outputs.versions }}
      images: ${{ steps.images.outputs.images }}
    env:
      DBGEN_DB_MEMORY: 3g
      DBGEN_WEB_MEMORY: 4g
      DBGEN_WEB_HEAP: 2500m
      DBGEN_HEADROOM: 3g
    steps:
      - name: Show the free disk
        run: df --human-readable /
      # Actions pinned by commit, which Dependabot updates (.github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tag, which publish requires at HEAD
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Exact, so CI changes only by a commit; within pyproject.toml's required-version.
          version: "0.13.7"
      - name: Record the disk use each minute
        # In the background until the job ends, uploaded with DHIS2's logs: the peak of the build,
        # the upgrades and the checks, against the runner's disk.
        run: |
          mkdir --parents output/logs
          nohup bash -c 'while true; do
            date --utc +%FT%TZ
            df --block-size=M --output=used,avail /
            docker system df
            sleep 60
          done' > output/logs/disk.log 2>&1 &
      - run: uv sync --locked
      - name: Build, upgrade and check 42.0, 42, 43.0 and 43
        run: uv run pipeline release mnch
      - name: Upload the manifests and DHIS2's logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            output/publish/**/manifest.json
            output/logs/
          if-no-files-found: ignore
      - name: Show what a release would publish
        if: ${{ !startsWith(github.ref, 'refs/tags/') || vars.PUBLISH != 'true' }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::warning::variable PUBLISH is not true: a dry run, nothing published"
          fi
          uv run pipeline publish mnch --dry-run
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/') && vars.PUBLISH == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PERF_DATABASES_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PERF_DATABASES_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-west-1
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::error::secret PERF_DATABASES_AWS_ACCESS_KEY_ID is not set"
            exit 1
          fi
          uv run pipeline publish mnch
      - name: The DHIS2 image each version was checked with, by digest
        id: images
        # From the manifests, for the perf tests: a tag such as dhis2/core:43 moves with each patch,
        # and core's harness pulls only dhis2/core-dev and core-pr, so it could run a cached older
        # patch than the one the dump was migrated and checked with.
        run: |
          images=$(jq --slurp --compact-output 'map({(.version): .images.dhis2}) | add' \
            output/publish/*/*/manifest.json)
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "versions=$(jq --compact-output keys_unsorted <<< "$images")" >> "$GITHUB_OUTPUT"
          jq . <<< "$images"

  # Core's perf tests run only in dhis2/dhis2-core, on its perf runner: dispatch them there, one
  # smoke run per version, as a consumer restores the published dump.
  perf-tests:
    needs: release
    if: >-
      startsWith(github.ref, 'refs/tags/') && vars.PUBLISH == 'true'
      && vars.CORE_PERF_TESTS == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.release.outputs.versions) }}
    steps:
      - name: Run PerfLandMnchTrackerTest's smoke profile in dhis2/dhis2-core
        env:
          GH_TOKEN: ${{ secrets.CORE_PERF_TESTS_TOKEN }}
          REF: ${{ vars.CORE_PERF_TESTS_REF || 'master' }}
          VERSION: ${{ matrix.version }}
          IMAGE: ${{ fromJSON(needs.release.outputs.images)[matrix.version] }}
        run: |
          gh workflow run performance-tests.yml --repo dhis2/dhis2-core \
            --field perf_tests_git_ref="$REF" \
            --field test_name="perfland-mnch-$VERSION" \
            --field test_env="DHIS2_IMAGE=$IMAGE
          SIMULATION_CLASS=org.hisp.dhis.test.tracker.PerfLandMnchTrackerTest
          DB_TYPE=perfland-mnch
          DB_VERSION=$VERSION
          MVN_ARGS=-Dprofile=smoke"
          echo "dispatched; see https://github.com/dhis2/dhis2-core/actions/workflows/performance-tests.yml"
