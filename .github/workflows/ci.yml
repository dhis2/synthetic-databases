# The checks of the pre-commit hooks (ruff, ty) and the tests, the spec and its metadata checked,
# and a release of the test area, a ward, along the tree to 43, without the upload. On main and on
# pull requests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions pinned by commit, which Dependabot updates (.github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # dbgen lock --check reads the first commit of each metadata file
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Exact, so CI changes only by a commit; within pyproject.toml's required-version.
          version: "0.13.7"
      # --locked fails if uv.lock does not match pyproject.toml.
      - run: uv sync --locked
      - run: uv run --locked pre-commit run --all-files --show-diff-on-failure
      - run: uv run --locked pytest
      - name: Explain the spec
        run: uv run --locked dbgen explain databases/mnch/mnch.toml > /dev/null
      - name: Check the metadata against its packages
        run: uv run --locked dbgen lock --check

  ward:
    # A standard runner of a public repository: 4 CPUs, 16 GB, 14 GB of disk. The caps fit the
    # build stack and the pipeline's into it, and dbgen leaves 3 GiB beside them.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DBGEN_DB_MEMORY: 3g
      DBGEN_WEB_MEMORY: 4g
      DBGEN_WEB_HEAP: 2500m
      DBGEN_HEADROOM: 3g
    steps:
      - name: Free disk space
        # dbgen needs 10 GiB free where Docker keeps its data, the runner has 14 GB.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df --human-readable /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Exact, so CI changes only by a commit; within pyproject.toml's required-version.
          version: "0.13.7"
      - run: uv sync --locked
      - name: Build the ward at 42.0, upgrade it along the tree and check every version
        run: uv run --locked pipeline release mnch --test
      - name: Upload the manifests and DHIS2's logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ward
          path: |
            output/publish/**/manifest.json
            output/logs/
          if-no-files-found: ignore
