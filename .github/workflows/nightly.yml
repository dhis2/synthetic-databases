# The nightly: the published 43 upgraded to dhis2/core-dev:latest, checked and published as dev.
# A failure is a migration of master failing or slow on realistic data: tell core.
#
# Only when the published dev is out of date (pipeline nightly --if-changed): none published,
# another pipeline commit, another published 43, or new migrations on DHIS2 master. Otherwise it
# stops after that comparison, and publishes nothing.
#
# Dispatched with from_scratch, it builds 42.0 and upgrades it to 43.0 and 43 here instead of
# fetching the published 43, and publishes only dev: a dev before any release, to iterate on. It
# checks dev alone, not the versions on the way.
#
# Needs the environment publish, whose variable AWS_ROLE_ARN is the role it assumes to upload.
# The schedule needs variable PUBLISH set to true too: without it the scheduled job is skipped,
# as there is no published 43 to start from.
name: Nightly

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      from_scratch:
        description: "Build 43 here instead of fetching the published one"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-perfland-mnch
  cancel-in-progress: false

jobs:
  nightly:
    if: github.event_name == 'workflow_dispatch' || vars.PUBLISH == 'true'
    # A standard runner of a public repository: 4 CPUs and 16 GB, with the caps of ci.yml's
    # release-test, which also cap the pipeline's stack. Unless from_scratch, it builds nothing
    # with dbgen, only restores, upgrades and dumps the release area.
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    # The environment the role trusts, which deploys from main only.
    environment: publish
    permissions:
      contents: read
      id-token: write # the OIDC token the role is assumed with
    env:
      DBGEN_DB_MEMORY: 3g
      DBGEN_WEB_MEMORY: 4g
      DBGEN_WEB_HEAP: 2500m
      DBGEN_HEADROOM: 3g
    steps:
      - name: Show the free disk
        run: df --human-readable /
      # Actions pinned by commit, which Dependabot updates (.github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Exact, so CI changes only by a commit; within pyproject.toml's required-version.
          version: "0.13.7"
      - run: uv sync --locked
      - name: Build 42.0 and upgrade it to 43.0 and 43
        if: inputs.from_scratch
        run: |
          uv run pipeline build mnch
          uv run pipeline upgrade mnch 43.0
          uv run pipeline upgrade mnch 43
      - name: Upgrade the 43 built here to dev and check it
        if: inputs.from_scratch
        run: uv run pipeline nightly mnch --local
      - name: Fetch the published 43, upgrade it to dev and check it, if dev is out of date
        if: ${{ !inputs.from_scratch }}
        env:
          # For GitHub's API, which tells whether DHIS2 master changed its migrations.
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run pipeline nightly mnch --if-changed
      - name: Upload the manifest and DHIS2's logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly
          path: |
            output/publish/**/manifest.json
            output/logs/
          if-no-files-found: ignore
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        # Only for a dev made in this run: none if the published one was current.
        if: hashFiles('output/publish/*/dev/manifest.json') != ''
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Publish dev
        if: hashFiles('output/publish/*/dev/manifest.json') != ''
        run: uv run pipeline publish mnch dev
