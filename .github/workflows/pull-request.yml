# Lint and test the pipeline, check the spec and its metadata, and run a release of the test
# area, a ward, along the tree to 43, without the upload.
name: Pull request

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # dbgen lock --check reads the first commit of each metadata file
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run ty check
      - run: uv run pytest
      - name: Explain the spec
        run: uv run dbgen explain databases/mnch/mnch.toml > /dev/null
      - name: Check the metadata against its packages
        run: uv run dbgen lock --check

  ward:
    # A standard runner of a public repository: 4 CPUs, 16 GB, 14 GB of disk. The caps fit the
    # build stack and the pipeline's into it, and dbgen leaves 3 GiB beside them.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DBGEN_DB_MEMORY: 3g
      DBGEN_WEB_MEMORY: 4g
      DBGEN_WEB_HEAP: 2500m
      DBGEN_HEADROOM: 3g
    steps:
      - name: Free disk space
        # dbgen needs 10 GiB free where Docker keeps its data, the runner has 14 GB.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df --human-readable /
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --frozen
      - name: Build the ward at 42.0, upgrade it along the tree and check every version
        run: uv run pipeline release mnch --test
      - name: Upload the manifests and DHIS2's logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ward
          path: |
            output/publish/**/manifest.json
            output/logs/
          if-no-files-found: ignore
