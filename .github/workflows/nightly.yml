# The nightly: the published 43 upgraded to dhis2/core-dev:latest, checked and published as dev.
# A failure is a migration of master failing or slow on realistic data: tell core.
#
# Needs the larger runner and the S3 secrets of release.yml.
name: Nightly

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-perfland-mnch
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-22.04-16c-64g-600gb
    timeout-minutes: 240
    steps:
      # Actions pinned by commit, which Dependabot updates (.github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - run: uv sync --locked
      - name: Fetch the published 43, upgrade it to dev and check it
        run: uv run --locked pipeline nightly mnch
      - name: Upload the manifest and DHIS2's logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly
          path: |
            output/publish/**/manifest.json
            output/logs/
          if-no-files-found: ignore
      - name: Publish dev
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PERF_DATABASES_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PERF_DATABASES_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-west-1
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::error::secret PERF_DATABASES_AWS_ACCESS_KEY_ID is not set"
            exit 1
          fi
          uv run --locked pipeline publish mnch dev
